name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  placeholder-check:
    name: Repository sanity check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify repository structure
        run: |
          echo "Project repository initialized."
          ls -la
          test -f README.md
          echo "Add language- or framework-specific checks here once the project stack is chosen."
